# 赌途 · 联机与排行后端部署
# 用法：在 server/ 目录下 `docker compose up -d --build`
services:
  pokerclub-server:
    build: .
    image: pokerclub-server:1.0.0
    container_name: pokerclub-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8123"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
      # 允许来源：前端在 GitHub Pages 上，需显式放行该域
      # 若同时用 Nginx 同域反代，可改为 https://milkteacoffee.github.io
      ALLOW_ORIGIN: "*"
      TZ: Asia/Shanghai
    volumes:
      # SQLite 数据持久化：宿主机 ./data 映射到容器 /app/data
      - ./data:/app/data
    ports:
      # 仅绑定回环，由宿主机 Nginx 反代并做 TLS；避免直接暴露 8123
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8123/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
