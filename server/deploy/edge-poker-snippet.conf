# ===== 牌友小馆（PokerClub）棋牌后端：只挂路径前缀，复用 modelghost.cn 证书 =====
# 前端：https://milkteacoffee.github.io/PokerClub/ （GitHub Pages）
# 后端：https://modelghost.cn/_poker/  →  pokerclub-server:8123
# 注意：改完必须 docker exec edge-nginx nginx -t 通过后再 nginx -s reload
#
# 路由约定（前端 POKERCLUB_SERVER 设为 https://modelghost.cn/_poker）：
#   /_poker/api/xxx  →  http://pokerclub-server:8123/api/xxx
#   /_poker/ws       →  http://pokerclub-server:8123/ws   （WebSocket 升级）
#   /_poker/health   →  http://pokerclub-server:8123/health

# ---------- REST：去掉 /_poker 前缀后转发 ----------
location ^~ /_poker/api/ {
    # CORS 由后端 ALLOW_ORIGIN 统一处理，这里原样透传响应头
    proxy_pass http://pokerclub-server:8123/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    add_header Cache-Control "no-cache" always;
}

# ---------- 健康检查 ----------
location = /_poker/health {
    proxy_pass http://pokerclub-server:8123/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

# ---------- WebSocket：必须透传 Upgrade / Connection，且关闭缓冲 ----------
location = /_poker/ws {
    proxy_pass http://pokerclub-server:8123/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 长连接：牌局可能持续很久，读写超时都要放宽
    proxy_buffering off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;
}
