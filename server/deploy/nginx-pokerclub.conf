# 赌途 · 联机后端 Nginx 反代配置
#
# 放置位置（Ubuntu/Debian 阿里云通常如此）：
#   /etc/nginx/conf.d/pokerclub-server.conf
# 然后：sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   - 前端页面在 GitHub Pages，后端只处理 /api/* 与 /ws
#   - WebSocket 必须显式透传 Upgrade / Connection 头，并关闭缓冲
#   - 证书用 certbot 申请：sudo certbot --nginx -d api.你的域名

upstream pokerclub_backend {
    server 127.0.0.1:8123;
    keepalive 32;
}

# WebSocket 升级所需变量（放在 http 上下文；若已有则去掉这两行）
map $http_upgrade $connection_upgrade_pc {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.example.com;   # ← 改成你的域名

    # 若已配置 certbot，它会自动插入 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;   # ← 改成你的域名

    # ← certbot 会自动填好这两行
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # 排行 / 好友等 REST 接口
    location /api/ {
        proxy_pass         http://pokerclub_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 健康检查（可留作被外部探针探测）
    location = /health {
        proxy_pass       http://pokerclub_backend/health;
        access_log       off;
    }

    # 联机 WebSocket —— 这是长连接，超时必须放大
    location /ws {
        proxy_pass         http://pokerclub_backend;
        proxy_http_version 1.1;

        # 关键三行：完成 WebSocket 协议升级
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade_pc;

        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # 长连接：1 小时无数据也不主动断（服务端自己有心跳）
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # 关闭缓冲，否则消息会被攒着不发
        proxy_buffering off;
        proxy_cache     off;
    }
}
